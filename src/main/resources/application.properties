spring.application.name=perpustakaan-bce

# Railway mengirim port lewat variabel PORT; lokal tetap 8080
server.port=${PORT:8080}

# Database H2 in-memory (data kembali ke data.sql tiap aplikasi dijalankan ulang)
spring.datasource.url=jdbc:h2:mem:perpustakaan;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Konsol H2 mati secara default. Nyalakan lokal: set H2_CONSOLE=true
spring.h2.console.enabled=${H2_CONSOLE:false}

# Tabel dibuat otomatis dari @Entity, lalu data.sql dijalankan
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
